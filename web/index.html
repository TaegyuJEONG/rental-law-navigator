<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Housing Law Navigator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif&display=swap');
/* FTJA design system: warm editorial tokens — ivory canvas, near-black ink, one restrained forest-green accent. */
:root{
  --bg:#F3F0E9;--surface:#FBFAF6;--surface2:#ECE9E1;--border:#D8D3C8;--border2:#B8B1A5;
  --text:#1D1B19;--text2:#53504A;--text3:#858078;
  --accent:#2E5142;--accent-dim:#E6EEE9;--accent-border:#A8BDB1;--accent-text:#244437;--on-accent:#F3F0E9;
  --success:#2F6B50;--success-bg:#E4F0E8;--success-text:#24543E;
  --danger:#9A4E47;--danger-bg:#F4E5E1;--danger-text:#713A35;
  --warn:#8A6D2F;--warn-bg:#F3EBD7;--warn-text:#6D5424;
  --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;--serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,5vw,72px)}
.legal{background:var(--warn-bg);color:var(--warn-text);font:500 11px/1.5 var(--mono);letter-spacing:.02em;padding:8px 16px;text-align:center;border-bottom:1px solid var(--border);min-height:34px;display:flex;align-items:center;justify-content:center}
@media(min-width:980px){.legal{white-space:nowrap;height:34px}}
@media(max-width:979px){.legal{min-height:68px}}
header{padding:38px 0 0}
h1{font:400 38px/1 var(--serif);letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--text3);font-size:12px;letter-spacing:.02em}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.asof{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:11px var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
input,select,button{font:inherit}
.asof input,input[type=search],select{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:2px;padding:8px 10px;text-transform:none;letter-spacing:0}
input[type=search],select{width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{cursor:pointer;font:11.5px var(--mono);border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:999px;padding:7px 14px}
button:hover{border-color:var(--border2);background:var(--surface2)}
button.on{color:var(--accent-text);border-color:var(--accent);background:var(--accent-dim);font-weight:600}
nav{display:flex;gap:28px;margin-top:30px;border-bottom:1px solid var(--border);flex-wrap:wrap}
nav button,nav button:hover{font:12px var(--mono);border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 0 12px;color:var(--text3)}
nav button.on{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:600;background:none}
main{padding:30px 0 96px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}.list{max-height:30vh}h1{font-size:30px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:22px 24px}
.grid>.card:first-child{background:transparent;border:0;padding:0}
.list{max-height:66vh;overflow:auto;margin-top:14px}
.row{padding:12px 4px 13px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:600}
.row:hover{background:rgba(46,81,66,.08)}
.row.on{border-top-color:var(--accent);background:rgba(46,81,66,.13)}
.row small{color:var(--text3);display:block;font:400 10.5px var(--mono);margin-top:3px}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);margin:30px 0 10px}
.stack{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px;font-size:13px;color:var(--text3)}
.stack span.j{background:var(--accent-dim);color:var(--accent-text);border:1px solid var(--accent-border);border-radius:999px;padding:3px 11px;font-weight:600}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.facts b{color:var(--text);font-weight:600}
.note{font-size:12px;background:var(--warn-bg);color:var(--warn-text);border-left:3px solid var(--warn);padding:7px 11px;margin-top:10px}
.rule{border-top:1px solid var(--border);padding:16px 0 14px}
.card>.rule:last-child{padding-bottom:0}
.rule .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .t{font-size:15px;font-weight:600}
.badge{font:600 10.5px var(--mono);border-radius:999px;padding:4px 10px;white-space:nowrap;border:1px solid transparent}
.b-applies,.b-in_force{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.b-unknown{background:var(--warn-bg);color:var(--warn-text)}
.b-superseded{background:var(--surface2);color:var(--text2);border-color:var(--border)}
.b-not_yet_effective{background:#EEF3D8;color:#55621C;border-color:#C6D08E}
.b-pending{background:transparent;color:var(--text2);border:1px dashed var(--border2)}
.b-failed,.b-conflict{background:var(--danger-bg);color:var(--danger-text)}
.req{margin:10px 0 3px;color:var(--text);line-height:1.6}
.kv{font-size:12px;color:var(--text3);line-height:1.6}
.why{font-size:12.5px;color:var(--text2);line-height:1.65;margin-top:8px}
.why b{color:var(--text);font-weight:600}
.cite{font:11px var(--mono);color:var(--text3);margin-top:8px}
details{margin-top:8px;font-size:12px}
details.card{font-size:13px}
summary{cursor:pointer;color:var(--accent-text);font:600 11px var(--mono)}
blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--border2);background:var(--surface2);font-size:12.5px;font-style:italic;color:var(--text2);overflow-wrap:anywhere}
blockquote .kv{font-style:normal;font-family:var(--mono);font-size:10.5px}
a{color:var(--accent-text)}
.none{font-size:12px;color:var(--text3);border-top:1px dashed var(--border2);padding:10px 0}
.none b{color:var(--text2);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:9px 10px 9px 0;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text3);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}
.pill{display:inline-block;font:10.5px var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin:2px;cursor:pointer;color:var(--text2)}
.pill:hover{border-color:var(--accent-border);background:var(--accent-dim)}
.kpis{display:flex;gap:0;flex-wrap:wrap;margin:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.kpi{padding:12px 26px 12px 0;min-width:120px}
.kpi b{display:block;font:400 30px/1.1 var(--serif);color:var(--text)}
.kpi span{font:10px var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.pass{color:var(--success);font:600 11px var(--mono)}.fail{color:var(--danger);font:600 11px var(--mono)}
ol.pipe{padding-left:20px;color:var(--text2);font-size:13px;line-height:1.65}ol.pipe li{margin-bottom:8px}ol.pipe b{color:var(--text)}
ul{color:var(--text2);font-size:13px;line-height:1.65;padding-left:20px}
header{position:relative}
.lang{position:absolute;top:14px;right:0;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:6px 12px}
.tl{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;font-size:12.5px}
.tl .d{font:600 11px var(--mono);white-space:nowrap;color:var(--text)}
.tl a{cursor:pointer;text-decoration:underline;text-decoration-color:var(--accent-border)}
.tlt td.d{font:600 11px var(--mono);white-space:nowrap}
.tlt td{font-size:12.5px}
.count{font:11px var(--mono);color:var(--text3);margin-top:12px}
.qwrap{position:relative}
.eg{display:none;font-size:13px;color:var(--text3);padding:9px 11px;border:1px solid var(--border);border-top:0;background:var(--surface);cursor:pointer}
.qwrap:focus-within .eg{display:block}
.eg:hover{background:var(--surface2)}
</style>
</head>
<body>
<div class="legal" data-i="legal">Not legal advice. This prototype shows what public law text says for an address; it is not a compliance certification.</div>
<div class="wrap"><header>
  <button id="lang" class="lang" aria-label="Switch language">🇪🇸 Español</button>
  <div class="bar">
    <div><h1>Rental Housing Law Navigator</h1><div class="sub" data-i="tagline">Which rules apply at this address on this date — every answer cited to its source.</div></div>
    <div class="asof"><span data-i="asof">As of</span>
      <input type="date" id="asof">
      <button id="today" data-d="2026-10-01" data-i="today">Default date</button>
</div>
  </div>
  <nav id="nav"><button data-v="lookup" class="on" data-i="tab_lookup">Address lookup</button><button data-v="changes" data-i="tab_changes">Change tracking</button><button data-v="rules" data-i="tab_rules">Rules</button><button data-v="method" data-i="tab_method">Method &amp; audit</button></nav>
</header>
<main id="view">Loading…</main></div>
<script type="module" src="app.js?v=14"></script>
</body>
</html>
